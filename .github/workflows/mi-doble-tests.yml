name: Mi Doble checks

on:
  push:
    paths:
      - "mi-doble/**"
      - ".github/workflows/mi-doble-tests.yml"
  pull_request:
    paths:
      - "mi-doble/**"
      - ".github/workflows/mi-doble-tests.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mi-doble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SQLCipher system library
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlcipher-dev build-essential pkg-config
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        env:
          MIDOBLE_DB_KEY: ${{ secrets.MIDOBLE_TEST_DB_KEY }}
          MIDOBLE_HOST: 127.0.0.1
        run: pytest -q
