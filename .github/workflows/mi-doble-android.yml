name: Mi Doble Android CI

on:
  push:
    paths:
      - "mi-doble/android/**"
      - ".github/workflows/mi-doble-android.yml"
  pull_request:
    paths:
      - "mi-doble/android/**"
      - ".github/workflows/mi-doble-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble-debug:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mi-doble/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.31.6"
      - name: Configure and validate permanent beta signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MIDOBLE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MIDOBLE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MIDOBLE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MIDOBLE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Permanent signing secrets are missing. Refusing to build or publish an APK with a temporary key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/midoble-beta.jks"
          test -s "$RUNNER_TEMP/midoble-beta.jks"
          keytool -list -keystore "$RUNNER_TEMP/midoble-beta.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "MIDOBLE_KEYSTORE_PATH=$RUNNER_TEMP/midoble-beta.jks" >> "$GITHUB_ENV"
          echo "MIDOBLE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MIDOBLE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "MIDOBLE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "Permanent signing keystore and alias validated."
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Run Android unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK signature fingerprint
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH" | tee "$RUNNER_TEMP/midoble-apk-certificate.txt"
          ACTUAL="$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/midoble-apk-certificate.txt" | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="6283498ba310f73633d40bf13d94a8b6fcf058f0b4a91513a7fec1bebfdb5a6d"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK certificate fingerprint does not match the permanent Mi Doble signing key. Publication blocked."
            exit 1
          fi
          echo "APK signature matches the permanent Mi Doble certificate."
      - name: Version debug APK
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -z "$VERSION_NAME" ]; then
            echo "Could not read versionName from app/build.gradle.kts"
            exit 1
          fi
          APK_NAME="MiDoble-${VERSION_NAME}-build-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
      - name: Verify versioned debug APK
        run: test -s "app/build/outputs/apk/debug/$APK_NAME"
      - name: Publish direct APK download
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="mi-doble-v${VERSION_NAME}-build-${GITHUB_RUN_NUMBER}"
          APK_PATH="app/build/outputs/apk/debug/${APK_NAME}"
          gh release create "$TAG" "$APK_PATH" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Mi Doble ${VERSION_NAME} (Build ${GITHUB_RUN_NUMBER})" \
            --notes "APK Android firmada con la clave permanente de Mi Doble.\n\nCommit: ${GITHUB_SHA}" \
            --prerelease
